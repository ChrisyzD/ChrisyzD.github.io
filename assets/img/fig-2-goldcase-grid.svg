  <title id="fig-2-goldcase-grid-title">Build the ruler before the feature</title>
  <desc id="fig-2-goldcase-grid-desc">A grid of twenty gold-case scenarios across five pipeline stages. Every cell holds a pinned expected output kept in version control, and one marked cell shows how a single failure names both the stage and the case it broke on.</desc>
