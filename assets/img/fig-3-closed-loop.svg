<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="752" viewBox="0 0 800 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-closed-loop-title fig-3-closed-loop-desc">
  <title id="fig-3-closed-loop-title">The loop that grows its own ruler</title>
  <desc id="fig-3-closed-loop-desc">A four-step cycle — measure, locate, fix, add a guardrail — running clockwise around a shared ruler at the centre. The guardrail step writes each fix back into the ruler as a new case, and the measure step runs that ruler again, so the same mistake cannot happen twice.</desc>
  <defs>
    <style>
      .s  { font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .ttl{ font-size:26px; font-weight:600; fill:#16181d; letter-spacing:-0.01em; }
      .sub{ font-size:14px; font-weight:400; fill:#5b6068; }
      .eyb{ font-size:9px;  font-weight:500; fill:#5b6068; letter-spacing:0.18em; }
      .nam{ font-size:16px; font-weight:600; fill:#16181d; }
      .slb{ font-size:10px; font-weight:400; fill:#5b6068; }
      .alb{ font-size:9px;  font-weight:400; fill:#8b9198; letter-spacing:0.06em; }
      .lgd{ font-size:10px; fill:#5b6068; }
    </style>
    <marker id="f3-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6068"/></marker>
    <marker id="f3-arw-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b5cad"/></marker>
    <marker id="f3-arw-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b9198"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- header -->
  <text class="m eyb" x="40" y="48">FIG. 3 · THE CLOSED LOOP</text>
  <text class="s ttl" x="40" y="84">The loop that grows its own ruler</text>
  <text class="s sub" x="40" y="112">Measure, locate, fix &#8212; then turn the fix into a guardrail, so the ruler grows on its own.</text>

  <!-- ring flow (clockwise) -->
  <path d="M 480.000 199.361 A 216 216 0 0 1 613.435 366.814" fill="none" stroke="#5b6068" stroke-width="1.2" marker-end="url(#f3-arw)"/>
  <path d="M 613.616 432.000 A 216 216 0 0 1 481.113 600.191" fill="none" stroke="#5b6068" stroke-width="1.2" marker-end="url(#f3-arw)"/>
  <path d="M 320.000 600.639 A 216 216 0 0 1 186.565 433.186" fill="none" stroke="#5b6068" stroke-width="1.2" marker-end="url(#f3-arw)"/>
  <path d="M 186.384 368.000 A 216 216 0 0 1 318.887 199.809" fill="none" stroke="#5b6068" stroke-width="1.2" marker-end="url(#f3-arw)"/>

  <!-- spokes : write into the ruler, read back out of it -->
  <path d="M 264 400 L 306 400" fill="none" stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#f3-arw-acc)"/>
  <path d="M 400 356 L 400 222" fill="none" stroke="#8b9198" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#f3-arw-soft)"/>

  <rect x="410" y="282" width="86" height="12" rx="2" fill="#ffffff"/>
  <text class="m alb" x="416" y="291">RUN THE SUITE</text>

  <!-- instance notes -->
  <rect x="40" y="164" width="160" height="96" rx="6" fill="#ffffff" stroke="rgba(22,24,29,0.18)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text class="m eyb" x="56" y="186">INSTANCE</text>
  <text class="s nam" x="56" y="212" font-size="14">MetaFlow</text>
  <text class="m slb" x="56" y="230">gold-case suite,</text>
  <text class="m slb" x="56" y="244">in version control</text>

  <rect x="600" y="540" width="160" height="96" rx="6" fill="#ffffff" stroke="rgba(22,24,29,0.18)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text class="m eyb" x="616" y="562">INSTANCE</text>
  <text class="s nam" x="616" y="588" font-size="14">Capstone</text>
  <text class="m slb" x="616" y="606">data flywheel,</text>
  <text class="m slb" x="616" y="620">judge-scored</text>

  <!-- stations -->
  <rect x="320" y="152" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="320" y="152" width="160" height="64" rx="6" fill="#ffffff" stroke="#16181d" stroke-width="1"/>
  <text class="s nam" x="400" y="184" text-anchor="middle">Measure</text>
  <text class="m slb" x="400" y="202" text-anchor="middle">run the suite</text>

  <rect x="536" y="368" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="536" y="368" width="160" height="64" rx="6" fill="#ffffff" stroke="#16181d" stroke-width="1"/>
  <text class="s nam" x="616" y="400" text-anchor="middle">Locate</text>
  <text class="m slb" x="616" y="418" text-anchor="middle">which stage, which case</text>

  <rect x="320" y="584" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="320" y="584" width="160" height="64" rx="6" fill="#ffffff" stroke="#16181d" stroke-width="1"/>
  <text class="s nam" x="400" y="616" text-anchor="middle">Fix</text>
  <text class="m slb" x="400" y="634" text-anchor="middle">repair the cause</text>

  <!-- focal : the step that gets skipped -->
  <rect x="104" y="368" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="104" y="368" width="160" height="64" rx="6" fill="rgba(11,92,173,0.07)" stroke="#0b5cad" stroke-width="1.4"/>
  <text class="s nam" x="184" y="400" text-anchor="middle" fill="#0b5cad">Add a guardrail</text>
  <text class="m slb" x="184" y="418" text-anchor="middle" fill="#0b5cad">becomes a new case</text>

  <!-- hub : accumulated state -->
  <rect x="312" y="356" width="176" height="88" rx="8" fill="#16181d"/>
  <text class="s nam" x="400" y="396" text-anchor="middle" fill="#ffffff">The ruler</text>
  <text class="m slb" x="400" y="416" text-anchor="middle" fill="rgba(255,255,255,0.75)">grows with every failure</text>

  <!-- legend -->
  <line x1="40" y1="688" x2="760" y2="688" stroke="#e3e5e8" stroke-width="0.8"/>
  <text class="m eyb" x="40" y="712" letter-spacing="0.14em">LEGEND</text>
  <line x1="128" y1="708" x2="156" y2="708" stroke="#5b6068" stroke-width="1.2"/>
  <text class="s lgd" x="164" y="712">loop step</text>
  <line x1="264" y1="708" x2="292" y2="708" stroke="#8b9198" stroke-width="1" stroke-dasharray="5,4"/>
  <text class="s lgd" x="300" y="712">reads / writes the ruler</text>
  <rect x="504" y="701" width="14" height="12" rx="2" fill="rgba(11,92,173,0.07)" stroke="#0b5cad" stroke-width="1.2"/>
  <text class="s lgd" x="526" y="712">the step that gets skipped</text>
</svg>
