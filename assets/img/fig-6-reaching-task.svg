<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="680" viewBox="0 0 800 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-6-reaching-task-title fig-6-reaching-task-desc">
  <title id="fig-6-reaching-task-title">Center-out reaching task</title>
  <desc id="fig-6-reaching-task-desc">A schematic of the center-out reaching paradigm: a start position at the center, eight targets evenly spaced on a ring around it, and one illustrative path drawn from the center to the active target. No recorded subject data is shown.</desc>
  <defs>
    <style>
      .s  { font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .ttl{ font-size:26px; font-weight:600; fill:#16181d; letter-spacing:-0.01em; }
      .sub{ font-size:14px; font-weight:400; fill:#5b6068; }
      .eyb{ font-size:9px;  font-weight:500; fill:#5b6068; letter-spacing:0.18em; }
      .tag{ font-size:9px;  font-weight:400; fill:#8b9198; letter-spacing:0.12em; }
      .asd{ font-size:14px; font-style:italic; fill:#16181d; }
      .lgd{ font-size:10px; fill:#5b6068; }
      .note{ font-size:9px; fill:#8b9198; letter-spacing:0.04em; }
    </style>
    <marker id="f6-arw-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b5cad"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- header -->
  <text class="m eyb" x="40" y="48">FIG. 6 · TASK PARADIGM · SCHEMATIC</text>
  <text class="s ttl" x="40" y="84">Center-out reaching task</text>
  <text class="s sub" x="40" y="112">Hold at the center, reach to one lit target, return. The path is recorded on every trial.</text>

  <!-- target ring guide -->
  <circle cx="360" cy="368" r="176" fill="none" stroke="rgba(22,24,29,0.12)" stroke-width="0.8" stroke-dasharray="2,4"/>

  <!-- eight targets -->
  <circle cx="360" cy="192" r="22" fill="#ffffff" stroke="#16181d" stroke-width="1"/>
  <circle cx="544" cy="368" r="22" fill="#ffffff" stroke="#16181d" stroke-width="1"/>
  <circle cx="484" cy="492" r="22" fill="#ffffff" stroke="#16181d" stroke-width="1"/>
  <circle cx="360" cy="544" r="22" fill="#ffffff" stroke="#16181d" stroke-width="1"/>
  <circle cx="236" cy="492" r="22" fill="#ffffff" stroke="#16181d" stroke-width="1"/>
  <circle cx="192" cy="368" r="22" fill="#ffffff" stroke="#16181d" stroke-width="1"/>
  <circle cx="236" cy="244" r="22" fill="#ffffff" stroke="#16181d" stroke-width="1"/>

  <!-- active target on this trial -->
  <circle cx="484" cy="244" r="22" fill="rgba(11,92,173,0.07)" stroke="#0b5cad" stroke-width="1.4"/>

  <!-- start position -->
  <circle cx="360" cy="368" r="16" fill="#ffffff" stroke="#16181d" stroke-width="1.2"/>
  <circle cx="360" cy="368" r="3" fill="#16181d"/>
  <text class="m tag" x="360" y="406" text-anchor="middle">START</text>

  <!-- one illustrative reach -->
  <path d="M 360 368 C 386 334, 414 310, 446 288 C 462 277, 470 262, 480 248"
        fill="none" stroke="#0b5cad" stroke-width="1.6" stroke-linecap="round" marker-end="url(#f6-arw-acc)"/>

  <!-- editorial aside -->
  <path d="M 584 206 Q 572 260 448 286" fill="none" stroke="rgba(22,24,29,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="446" cy="288" r="2" fill="#16181d"/>
  <text class="s asd" x="588" y="200">the path is the signal</text>

  <!-- legend -->
  <line x1="40" y1="600" x2="760" y2="600" stroke="#e3e5e8" stroke-width="0.8"/>
  <text class="m eyb" x="40" y="624" letter-spacing="0.14em">LEGEND</text>
  <circle cx="130" cy="620" r="6" fill="#ffffff" stroke="#16181d" stroke-width="1"/>
  <text class="s lgd" x="144" y="624">eight targets, evenly spaced</text>
  <circle cx="346" cy="620" r="6" fill="rgba(11,92,173,0.07)" stroke="#0b5cad" stroke-width="1.2"/>
  <text class="s lgd" x="360" y="624">active target on this trial</text>
  <line x1="554" y1="620" x2="582" y2="620" stroke="#0b5cad" stroke-width="1.6"/>
  <text class="s lgd" x="590" y="624">one illustrative reach</text>

  <text class="m note" x="40" y="652">SCHEMATIC ONLY &#183; NO RECORDED SUBJECT DATA IS SHOWN.</text>
</svg>
